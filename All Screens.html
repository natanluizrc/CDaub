<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CDaub — All Screens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Canvas backdrop tones down so artboards pop */
    html, body { background: #0a0418; overflow: hidden; }
    body::before { display: none; }
    .dc-card { background: #0e0420 !important; }
    /* These overrides apply globally on this page (it only renders the bingo
       screens) so they also take effect inside the focus-mode overlay, which
       doesn't wrap content in .dc-card. */
    .app {
      background: transparent !important;
      height: 100% !important;
      min-height: 0 !important;
    }
    /* Media queries fire on the viewport, not the artboard, so when the canvas
       window is narrow the in-game layout would collapse to a single column
       inside a 1440-wide artboard. Force the multi-column layout here. */
    .caller {
      grid-template-columns: 1.05fr 1fr !important;
      min-height: 0;
    }
    .player-shell {
      grid-template-columns: 1.2fr 1fr !important;
      min-height: 0;
    }
    .caller .left,
    .player-shell .left {
      border-right: 1px solid var(--line) !important;
      border-bottom: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="screens-welcome.jsx"></script>
  <script type="text/babel" src="screens-host.jsx"></script>
  <script type="text/babel" src="screens-player.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function AllScreens() {
      return (
        <DesignCanvas title="CDaub — All Screens" subtitle="Every screen in the bingo flow, side by side">
          <DCSection id="onboarding" title="Onboarding">
            <DCArtboard id="welcome" label="01 · Welcome" width={1440} height={900}>
              <WelcomeScreen />
            </DCArtboard>
            <DCArtboard id="connect" label="02 · Join room (player)" width={1440} height={900}>
              <ConnectScreen />
            </DCArtboard>
          </DCSection>

          <DCSection id="game" title="In game">
            <DCArtboard id="host" label="03 · Host — calling numbers" width={1440} height={900}>
              <HostScreen />
            </DCArtboard>
            <DCArtboard id="player" label="04 · Player — marking the card" width={1440} height={900}>
              <PlayerScreen />
            </DCArtboard>
          </DCSection>

          <DCSection id="endgame" title="Win">
            <DCArtboard id="celebrate" label="05 · Celebration" width={1440} height={900}>
              <CelebrateScreen />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AllScreens />);
  </script>
</body>
</html>
